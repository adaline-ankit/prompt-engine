<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vibe Prompt Engine Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1>Vibe Prompt Engine Settings</h1>
    <section class="group">
      <label for="api-base-url">API Base URL</label>
      <input id="api-base-url" type="url" />
    </section>

    <section class="group grid">
      <label class="checkbox">
        <input id="inline-toolbar-enabled" type="checkbox" />
        <span>Show inline toolbar beside prompt boxes</span>
      </label>
      <label class="checkbox">
        <input id="include-surrounding-context" type="checkbox" />
        <span>Include surrounding page context</span>
      </label>
      <label class="checkbox">
        <input id="use-xml-tags" type="checkbox" />
        <span>Force XML-style prompt sections</span>
      </label>
    </section>

    <section class="group grid two">
      <div>
        <label for="verbosity">Verbosity</label>
        <select id="verbosity">
          <option value="concise">Concise</option>
          <option value="balanced">Balanced</option>
          <option value="elaborate">Elaborate</option>
        </select>
      </div>
      <div>
        <label for="reasoning-depth">Reasoning Depth</label>
        <select id="reasoning-depth">
          <option value="light">Light</option>
          <option value="standard">Standard</option>
          <option value="deep">Deep</option>
        </select>
      </div>
      <div>
        <label for="structure-preference">Structure Preference</label>
        <select id="structure-preference">
          <option value="auto">Auto</option>
          <option value="sections">Sections</option>
          <option value="bullets">Bullets</option>
          <option value="json">JSON</option>
        </select>
      </div>
      <div>
        <label for="grounding-mode">Grounding</label>
        <select id="grounding-mode">
          <option value="strict">Strict</option>
          <option value="balanced">Balanced</option>
        </select>
      </div>
      <div>
        <label for="tone">Tone</label>
        <select id="tone">
          <option value="professional">Professional</option>
          <option value="direct">Direct</option>
          <option value="technical">Technical</option>
          <option value="friendly">Friendly</option>
        </select>
      </div>
      <div>
        <label for="audience">Audience</label>
        <input id="audience" type="text" placeholder="developers, execs, support, ..." />
      </div>
    </section>

    <div class="row">
      <button id="save">Save</button>
      <button id="reset" class="ghost">Reset to Hosted Default</button>
    </div>
    <div id="status"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
