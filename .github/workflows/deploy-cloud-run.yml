name: deploy-cloud-run

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["release"]
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
    steps:
      - name: Check deploy configuration
        id: check
        run: |
          set -eu
          ready=true

          if [ -z "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ] && [ -z "${GCP_CREDENTIALS_JSON}" ]; then
            echo "Google Cloud auth is not configured." >> "${GITHUB_STEP_SUMMARY}"
            echo "Set either GCP_WORKLOAD_IDENTITY_PROVIDER plus GCP_SERVICE_ACCOUNT, or GCP_CREDENTIALS_JSON." >> "${GITHUB_STEP_SUMMARY}"
            ready=false
          fi

          if [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER}" ] && [ -z "${GCP_SERVICE_ACCOUNT}" ]; then
            echo "GCP_SERVICE_ACCOUNT is required when using GCP_WORKLOAD_IDENTITY_PROVIDER." >> "${GITHUB_STEP_SUMMARY}"
            ready=false
          fi

          if [ -z "${GCP_PROJECT_ID}" ] || [ -z "${GCP_REGION}" ] || [ -z "${CLOUD_RUN_SERVICE}" ]; then
            echo "Missing required repository variables. Set GCP_PROJECT_ID, GCP_REGION, and CLOUD_RUN_SERVICE." >> "${GITHUB_STEP_SUMMARY}"
            ready=false
          fi
          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"

      - name: Report deploy readiness
        run: |
          if [ "${{ steps.check.outputs.ready }}" = "true" ]; then
            echo "Cloud Run deployment is configured." >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Cloud Run deployment skipped until configuration is added." >> "${GITHUB_STEP_SUMMARY}"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud via Workload Identity Federation
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Authenticate to Google Cloud via Service Account JSON
        if: env.GCP_WORKLOAD_IDENTITY_PROVIDER == '' && env.GCP_CREDENTIALS_JSON != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ env.GCP_CREDENTIALS_JSON }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.GCP_REGION }}
          source: .
          flags: >-
            --allow-unauthenticated
            --port=8000
            --set-env-vars=PROMPT_ENGINE_CONFIG=config/config.yaml

      - name: Report deployed URL
        run: |
          echo "Cloud Run URL: ${{ steps.deploy.outputs.url }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "MCP endpoint: ${{ steps.deploy.outputs.url }}/mcp" >> "${GITHUB_STEP_SUMMARY}"
