name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify version matches tag
        id: meta
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          version_file = pathlib.Path("VERSION").read_text(encoding="utf-8").strip()
          if version != version_file:
              raise SystemExit(f"VERSION mismatch: pyproject={version!r} VERSION={version_file!r}")
          print(f"version={version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
          PY

      - name: Fail on mismatched tag
        run: |
          test "v${{ steps.meta.outputs.version }}" = "${GITHUB_REF_NAME}"

      - name: Run smoke verification
        run: |
          python -m compileall backend evals tests examples
          python evals/runner.py
          python - <<'PY'
          from tests.test_engine import test_optimize_prompt_applies_expected_transformations, test_optimize_and_run_with_mock_provider
          from tests.test_api import test_optimize_endpoint_returns_prompt_metadata, test_run_endpoint_uses_mock_provider
          from tests.test_mcp import test_mcp_server_exposes_expected_tools_and_prompts, test_mcp_optimize_tool_runs_end_to_end, test_schema_suggestion_is_grounded_in_intent, test_api_mounts_mcp_endpoint
          test_optimize_prompt_applies_expected_transformations()
          test_optimize_and_run_with_mock_provider()
          test_optimize_endpoint_returns_prompt_metadata()
          test_run_endpoint_uses_mock_provider()
          test_mcp_server_exposes_expected_tools_and_prompts()
          test_mcp_optimize_tool_runs_end_to_end()
          test_schema_suggestion_is_grounded_in_intent()
          test_api_mounts_mcp_endpoint()
          print("release smoke tests passed")
          PY

      - name: Build distributions
        run: python -m build

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/prompt-engine/
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-container:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [build, publish-pypi, publish-container]
    if: ${{ always() && needs.build.result == 'success' && needs.publish-container.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
