name: release-bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version to set, for example 0.2.0"
        required: false
        type: string
      release_type:
        description: "Semantic version part to bump when version is empty"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump version files
        id: bump
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            version="$(python scripts/release_bump.py --version "${INPUT_VERSION}" --release-type "${INPUT_RELEASE_TYPE}")"
          else
            version="$(python scripts/release_bump.py --release-type "${INPUT_RELEASE_TYPE}")"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION pyproject.toml CHANGELOG.md
          git commit -m "chore: release v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main --follow-tags
