name: ci

on:
  push:
    paths:
      - "backend/**"
      - "config/**"
      - "evals/**"
      - "tests/**"
      - "scripts/**"
      - "extensions/**"
      - "VERSION"
      - "pyproject.toml"
  pull_request:
    paths:
      - "backend/**"
      - "config/**"
      - "evals/**"
      - "tests/**"
      - "scripts/**"
      - "extensions/**"
      - "VERSION"
      - "pyproject.toml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest
      - name: Run evals
        run: python evals/runner.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build VS Code extension
        run: |
          cd extensions/vscode-prompt-engine
          npm ci
          npm run build
